# Runs the tests on pull requests and pushes to main. Releases come from release.yml (tags only).
name: Tests

on:
  pull_request:
    paths: ["Sources/**", "Tests/**", "Packages/**", "Package.swift", "Package.resolved", "Resources/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Packages/**", "Package.swift", "Package.resolved", "Resources/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The macOS 26 SDK is required (scripts/ci-select-xcode.sh picks Xcode 26 or later).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ./scripts/ci-select-xcode.sh
      - name: Core tests
        run: swift test --disable-keychain
      - name: Syntax package tests
        # The vendored grammars are committed, so this needs neither network access nor the tree-sitter CLI.
        run: swift test --disable-keychain --package-path Packages/QuickEditSyntax
      - name: App builds
        run: swift build --disable-keychain --product QuickEdit
